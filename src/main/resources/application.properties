spring.application.name=AIProjektTest

# AI MODEL RELATERET - GEMINI 3.8 flash
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.8-flash}

# FRONTEND MAPPE KONFIGURATION - i stedet for ressources som er standard
spring.web.resources.static-locations=classpath:/frontend/
spring.mvc.static-path-pattern=/frontend/**